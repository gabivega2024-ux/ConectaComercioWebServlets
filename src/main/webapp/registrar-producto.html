
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar producto | ConectaComercio</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="contenedor">

        <header class="encabezado">
            <h1>ConectaComercio</h1>
            <p>Registro de productos</p>
        </header>

        <section class="tarjeta">

            <h2>Registrar nuevo producto</h2>

            <form action="productos" method="post">

                <label for="nombre">Nombre del producto</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    maxlength="100"
                    required
                >

                <label for="descripcion">Descripción</label>
                <textarea
                    id="descripcion"
                    name="descripcion"
                    rows="4"
                ></textarea>

                <label for="precio">Precio</label>
                <input
                    type="number"
                    id="precio"
                    name="precio"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="stock">Stock disponible</label>
                <input
                    type="number"
                    id="stock"
                    name="stock"
                    min="0"
                    required
                >

                <label for="idMayorista">ID del mayorista</label>
                <input
                    type="number"
                    id="idMayorista"
                    name="idMayorista"
                    min="1"
                    required
                >

                <button type="submit">
                    Registrar producto
                </button>

            </form>

            <a href="productos">Volver al catálogo</a>

        </section>

    </main>

</body>
</html>
